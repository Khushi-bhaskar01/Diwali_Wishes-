<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🪔 DevSource wishes you a Happy Diwali</title>
<meta name="description" content="Light the diyas and launch fireworks — DevSource wishes you a bright and joyful Diwali.">
<meta name="theme-color" content="#120826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#120826;
    --night-deep:#05020c;
    --marigold:#ffb300;
    --saffron:#ff7a00;
    --gold:#ffd77a;
    --rangoli:#e83f6f;
    --peacock:#1fa39a;
    --clay:#b5501e;
    --text:#fff3dc;
    --muted:#e6cfa8;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;min-height:100%}
  body{
    position:relative;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 115%, #4a1640 0%, rgba(74,22,64,0) 60%),
      radial-gradient(ellipse at 50% 0%, #1d0e3d 0%, var(--night) 45%, var(--night-deep) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #sky{z-index:0}
  #fx{z-index:1}

  /* ---------- Marigold toran ---------- */
  .toran{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:70px;z-index:6;pointer-events:none}
  .mg{
    position:absolute;width:20px;height:20px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(circle,#fff0a8 0 14%,transparent 16%),
      repeating-conic-gradient(#ff9a1f 0 14deg,#e86a00 14deg 28deg);
    box-shadow:0 0 8px rgba(255,140,0,.55), inset 0 -4px 5px rgba(120,30,0,.45);
  }
  .mg.y{
    background:
      radial-gradient(circle,#fff6c9 0 14%,transparent 16%),
      repeating-conic-gradient(#ffd23f 0 14deg,#f4a900 14deg 28deg);
  }
  .leaves{position:absolute;top:2px;width:0;height:0}
  .leaves i{
    position:absolute;left:-6px;top:0;width:12px;height:30px;
    background:linear-gradient(#4caf50,#1b5e20);
    border-radius:50% 50% 50% 50%/30% 30% 70% 70%;
    transform-origin:50% 0;
    box-shadow:inset -2px 0 0 rgba(255,255,255,.12);
  }
  .leaves i:nth-child(1){transform:rotate(28deg)}
  .leaves i:nth-child(2){transform:rotate(0deg);height:36px}
  .leaves i:nth-child(3){transform:rotate(-28deg)}

  /* ---------- Akash kandil lanterns ---------- */
  .lantern{
    position:absolute;top:env(safe-area-inset-top,0px);z-index:2;
    display:flex;flex-direction:column;align-items:center;
    transform-origin:50% 0;
    animation:swing var(--sw,4.5s) ease-in-out infinite alternate;
    pointer-events:none;
  }
  .lantern .string{width:2px;height:var(--len,90px);background:linear-gradient(#c9a227,#8a6d1a)}
  .lantern .cap{width:30px;height:9px;border-radius:3px;background:linear-gradient(#f2c14e,#a8780f)}
  .lantern .body{
    position:relative;width:56px;height:74px;
    border-radius:46% 46% 46% 46%/50% 50% 50% 50%;
    background:radial-gradient(circle at 50% 45%,#fff4b8 0%,#ffbe0b 22%,var(--hue1,#e63946) 62%,var(--hue2,#7a0f22) 100%);
    box-shadow:0 0 34px 10px var(--halo,rgba(255,110,40,.42));
    overflow:hidden;
  }
  .lantern .body::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(80,5,20,.35) 9px 11px);
  }
  .lantern .body::after{
    content:"";position:absolute;left:0;right:0;top:44%;height:7px;
    background:radial-gradient(circle,#ffe58a 1.5px,transparent 2px) 0 50%/8px 7px;
  }
  .lantern .tassel{width:7px;height:38px;border-radius:0 0 4px 4px;background:linear-gradient(#e0ac1a,var(--hue1,#e63946) 70%,transparent)}
  @keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

  /* ---------- Header ---------- */
  header{position:relative;z-index:3;margin-top:calc(88px + env(safe-area-inset-top,0px));text-align:center}
  .logo{width:110px;height:auto;display:block;margin:0 auto}
  .logo-text{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1rem;
    padding:7px 16px;border-radius:999px;color:var(--gold);
    border:1px solid rgba(255,215,122,.35);background:rgba(255,215,122,.07);
  }

  /* ---------- Hero ---------- */
  main{
    position:relative;z-index:3;width:100%;max-width:880px;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:12px 20px 0;
  }
  .hero{position:relative;padding:36px 0 8px;isolation:isolate}
  .rangoli{
    position:absolute;left:50%;top:50%;width:min(540px,96vw);aspect-ratio:1;
    transform:translate(-50%,-50%);opacity:.2;z-index:-1;pointer-events:none;
    animation:spin 160s linear infinite;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .shubh{
    margin:0;font-family:'Yatra One',serif;font-size:clamp(1.5rem,4.4vw,2.3rem);
    color:var(--saffron);letter-spacing:.03em;text-shadow:0 0 18px rgba(255,122,0,.55);
  }
  h1{
    margin:.05em 0 .1em;font-family:'Yatra One',serif;font-weight:400;
    font-size:clamp(3rem,11vw,6.6rem);line-height:1.02;letter-spacing:.01em;
    background:linear-gradient(100deg,#ff9a1f 0%,#fff2bf 18%,#ffcf4a 36%,#ff7a00 55%,#fff2bf 74%,#ff9a1f 100%);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 6s linear infinite;
    filter:drop-shadow(0 0 24px rgba(255,160,50,.45));
    transition:filter 1s;
  }
  body.finale h1{filter:drop-shadow(0 0 40px rgba(255,190,80,.9))}
  @keyframes shine{to{background-position:-220% center}}
  h2{
    margin:.2em auto 1.5em;max-width:34ch;font-weight:300;
    font-size:clamp(1.08rem,2.6vw,1.4rem);line-height:1.45;color:var(--muted);
  }

  /* ---------- Code editor wish ---------- */
  .editor{
    width:min(580px,100%);text-align:left;overflow:hidden;
    background:rgba(18,10,38,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(255,215,122,.22);border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 46px rgba(255,140,0,.12);
  }
  .bar{
    display:flex;align-items:center;gap:7px;padding:10px 14px;
    background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);
    font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#b9a98a;
  }
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.ylw{background:#febc2e}.dot.g{background:#28c840}
  .bar .file{margin-left:8px}
  .bar .status{margin-left:auto;color:#7fd99a}
  pre{
    margin:0;padding:16px 18px 20px;min-height:13.6em;
    font-family:'JetBrains Mono',monospace;font-size:clamp(.74rem,2.2vw,.9rem);line-height:1.7;
    white-space:pre-wrap;word-break:break-word;color:#efe3cf;
  }
  .t-c{color:#8a83a3;font-style:italic}.t-k{color:#ff7eb6}.t-v{color:#7fdbff}.t-f{color:#ffd77a}
  .t-s{color:#b5e36b}.t-n{color:#c3a6ff}.t-p{color:#efe3cf}
  .cursor{display:inline-block;width:.55em;height:1.15em;margin-left:1px;background:var(--marigold);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- Diyas ---------- */
  .diya-section{position:relative;z-index:3;width:100%;padding:40px 12px 18px;text-align:center}
  .hint{margin:0 0 6px;font-size:1.05rem;color:var(--muted);min-height:1.6em;transition:color .6s}
  body.finale .hint{color:var(--gold)}
  .diyas{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:clamp(6px,2.6vw,30px);row-gap:8px}
  .diya{
    position:relative;width:96px;height:104px;padding:0;border:0;background:none;cursor:pointer;
    transition:transform .25s;
  }
  .diya:hover{transform:translateY(-4px)}
  .diya:focus-visible{outline:2px dashed var(--gold);outline-offset:4px;border-radius:10px}
  .diya .glow{
    position:absolute;left:62%;bottom:34px;width:190px;height:190px;transform:translate(-50%,50%);
    border-radius:50%;pointer-events:none;opacity:0;transition:opacity .7s;
    background:radial-gradient(circle,rgba(255,180,60,.55) 0%,rgba(255,120,0,.16) 38%,transparent 68%);
  }
  .diya .bowl{
    position:absolute;left:6px;bottom:6px;width:78px;height:36px;
    border-radius:0 0 39px 39px/0 0 36px 36px;
    background:linear-gradient(180deg,#d9712a 0%,var(--clay) 50%,#6b2a0e 100%);
    box-shadow:inset 0 -7px 10px rgba(0,0,0,.35);
  }
  .diya .bowl::before{
    content:"";position:absolute;left:12%;right:12%;top:9px;height:7px;
    background:radial-gradient(circle,#ffd77a 1.7px,transparent 2.2px) 0 50%/10px 7px;
  }
  .diya .bowl::after{
    content:"";position:absolute;left:12%;right:12%;top:20px;height:2px;border-radius:2px;
    background:repeating-linear-gradient(90deg,var(--peacock) 0 6px,transparent 6px 10px);opacity:.85;
  }
  .diya .base{
    position:absolute;left:30px;bottom:0;width:30px;height:8px;border-radius:0 0 9px 9px;
    background:linear-gradient(#7a300f,#4a1c07);
  }
  .diya .spout{
    position:absolute;left:64px;bottom:34px;width:26px;height:26px;
    border-radius:0 50% 50% 50%;transform:rotate(135deg) scaleX(.7);
    background:linear-gradient(135deg,#e07b39,#a0461a);
  }
  .diya .rim{
    position:absolute;left:4px;bottom:34px;width:82px;height:15px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 45%,#3d2306 0 42%,#c2581c 50%,#e8873f 74%,#a0461a 100%);
  }
  .diya .wick{position:absolute;left:79px;bottom:46px;width:3px;height:8px;border-radius:2px;background:#2b1a0a;transform:rotate(-14deg)}
  .diya .flame{
    position:absolute;left:80px;bottom:50px;width:20px;height:42px;margin-left:-10px;
    transform-origin:50% 100%;transform:scale(0);opacity:0;
    transition:transform .55s cubic-bezier(.3,1.7,.5,1),opacity .35s;
  }
  .diya .flame::before{
    content:"";position:absolute;inset:0;
    border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
    background:radial-gradient(ellipse at 50% 78%,#fff 0 14%,#fff5b0 24%,#ffc93c 44%,#ff7b00 68%,rgba(255,60,0,0) 100%);
    box-shadow:0 0 22px 7px rgba(255,160,40,.55);
    transform-origin:50% 100%;
    animation:flicker var(--fl,1.3s) ease-in-out infinite;
  }
  .diya .flame::after{
    content:"";position:absolute;left:50%;bottom:1px;width:8px;height:9px;margin-left:-4px;border-radius:50%;
    background:radial-gradient(circle,rgba(110,170,255,.9),rgba(110,170,255,0) 70%);
  }
  .diya.lit .flame{transform:scale(1);opacity:1}
  .diya.lit .glow{opacity:1}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) skewX(0)}
    22%{transform:scaleY(1.09) skewX(-3deg) translateX(-1px)}
    48%{transform:scaleY(.93) skewX(2deg)}
    74%{transform:scaleY(1.05) skewX(-1.5deg) translateX(1px)}
  }

  /* ---------- Sound + footer ---------- */
  .sound-btn{
    position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:10;
    display:flex;align-items:center;gap:6px;
    font:600 .9rem 'Mukta',system-ui,sans-serif;color:var(--text);
    padding:7px 14px;border-radius:999px;cursor:pointer;
    background:rgba(18,10,38,.7);border:1px solid rgba(255,215,122,.4);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .2s,border-color .2s;
  }
  .sound-btn:hover{background:rgba(255,179,0,.16)}
  .sound-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .sound-btn[aria-pressed="true"]{border-color:var(--marigold);background:rgba(255,179,0,.2)}
  footer{position:relative;z-index:3;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:.92rem;color:rgba(230,207,168,.7);text-align:center}

  @media (max-width:600px){
    header{margin-top:calc(96px + env(safe-area-inset-top,0px))}
    .logo{width:86px}
    .lantern.wide{display:none}
    .lantern{--len:26px !important}
    .lantern .body{width:44px;height:58px}
    .diya{zoom:.74}
    .diyas{gap:4px 6px}
    .sound-btn{top:calc(62px + env(safe-area-inset-top,0px));right:10px;font-size:.82rem;padding:5px 11px}
    .lantern.side-l{left:3% !important}
    .lantern.side-r{right:3% !important}
  }
  @media (prefers-reduced-motion:reduce){
    .lantern,.rangoli,h1,.diya .flame::before,.cursor{animation:none}
  }
</style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="toran" aria-hidden="true"></div>

  <div class="lantern wide" style="left:6%;--len:110px;--sw:5s" aria-hidden="true"><div class="string"></div><div class="cap"></div><div class="body"></div><div class="cap"></div><div class="tassel"></div></div>
  <div class="lantern side-l" style="left:17%;--len:44px;--sw:4.2s;--hue1:#d63384;--hue2:#5a0b3d;--halo:rgba(255,80,160,.35)" aria-hidden="true"><div class="string"></div><div class="cap"></div><div class="body"></div><div class="cap"></div><div class="tassel"></div></div>
  <div class="lantern side-r" style="right:17%;--len:60px;--sw:4.8s;--hue1:#1fa39a;--hue2:#0b4744;--halo:rgba(40,220,200,.3)" aria-hidden="true"><div class="string"></div><div class="cap"></div><div class="body"></div><div class="cap"></div><div class="tassel"></div></div>
  <div class="lantern wide" style="right:6%;--len:120px;--sw:5.4s" aria-hidden="true"><div class="string"></div><div class="cap"></div><div class="body"></div><div class="cap"></div><div class="tassel"></div></div>

  <button class="sound-btn" type="button" aria-pressed="false">🔈 <span>Sound off</span></button>

  <header>
    <img class="logo" src="DevSource_LOGO.png" alt="DevSource"
         onerror="const s=document.createElement('span');s.className='logo-text';s.textContent='<DevSource />';this.replaceWith(s)">
  </header>

  <main>
    <section class="hero">
      <svg class="rangoli" viewBox="-250 -250 500 500" aria-hidden="true"></svg>
      <p class="shubh" lang="hi">शुभ दीपावली</p>
      <h1>Happy Diwali</h1>
      <h2>DevSource wishes you a bright and joyful festival of lights</h2>
    </section>

    <div class="editor" role="img" aria-label="Code wish: May your ideas compile perfectly, your dreams deploy smoothly, and your journey light up like festive code.">
      <div class="bar" aria-hidden="true">
        <span class="dot r"></span><span class="dot ylw"></span><span class="dot g"></span>
        <span class="file">diwali.js</span><span class="status">● build passing</span>
      </div>
      <pre id="code" aria-hidden="true"></pre>
    </div>
  </main>

  <section class="diya-section">
    <p class="hint" aria-live="polite">Tap each diya to light it 🪔</p>
    <div class="diyas"></div>
  </section>

  <footer>Tap anywhere in the sky to launch a firework · With love, DevSource</footer>

<script>
(() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= Rangoli ================= */
  (function buildRangoli(){
    const svg = document.querySelector('.rangoli');
    const rings = [
      {r:34,  n:8,  rx:9,  ry:22, c:'#e83f6f'},
      {r:78,  n:12, rx:11, ry:28, c:'#ffb300'},
      {r:124, n:16, rx:10, ry:26, c:'#1fa39a'},
      {r:170, n:22, rx:10, ry:28, c:'#ff7a00'},
      {r:214, n:30, rx:8,  ry:22, c:'#b06cff'}
    ];
    let s = '<circle r="20" fill="#ffd77a"/><circle r="10" fill="#e83f6f"/>';
    rings.forEach((g,gi) => {
      s += `<circle r="${g.r - g.ry - 4}" fill="none" stroke="#ffd77a" stroke-width="1.5" stroke-dasharray="3 5"/>`;
      for (let i=0;i<g.n;i++){
        const a = i*360/g.n;
        s += `<ellipse cx="0" cy="${-g.r}" rx="${g.rx}" ry="${g.ry}" fill="${g.c}" transform="rotate(${a})"/>`;
        s += `<circle cx="0" cy="${-g.r}" r="2.4" fill="#fff3dc" transform="rotate(${a})"/>`;
        s += `<circle cx="0" cy="${-(g.r + g.ry + 6)}" r="3" fill="${rings[(gi+1)%rings.length].c}" transform="rotate(${a + 180/g.n})"/>`;
      }
    });
    svg.innerHTML = s;
  })();

  /* ================= Toran ================= */
  const toran = document.querySelector('.toran');
  function buildToran(){
    const W = document.documentElement.clientWidth;
    const target = W < 600 ? 120 : 170;
    const swags = Math.max(2, Math.round(W / target));
    const sw = W / swags, sag = W < 600 ? 16 : 26;
    let h = '';
    for (let s=0; s<swags; s++){
      const per = Math.max(6, Math.round(sw / 15));
      for (let i=0; i<=per; i++){
        const t = i/per, x = s*sw + t*sw, y = 10 + sag*Math.sin(Math.PI*t);
        h += `<span class="mg${(i+s)%2 ? ' y' : ''}" style="left:${x}px;top:${y}px"></span>`;
      }
      h += `<span class="leaves" style="left:${s*sw}px"><i></i><i></i><i></i></span>`;
    }
    h += `<span class="leaves" style="left:${W}px"><i></i><i></i><i></i></span>`;
    toran.innerHTML = h;
  }

  /* ================= Sound (Web Audio, no files needed) ================= */
  let actx = null, master = null, noiseBuf = null, soundOn = false, lastBoom = 0;
  function initAudio(){
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain(); master.gain.value = .55; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
  }
  function noise(t, dur, type, f0, f1, vol){
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const flt = actx.createBiquadFilter(); flt.type = type;
    flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.012);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    src.connect(flt).connect(g).connect(master);
    src.start(t, Math.random()*1.5); src.stop(t+dur+.05);
  }
  function boom(crackle){
    if (!soundOn || !actx) return;
    const now = actx.currentTime;
    if (now - lastBoom < .08) return;
    lastBoom = now;
    noise(now, 1.3 + Math.random()*.5, 'lowpass', 900, 60, .9);
    if (crackle){
      for (let i=0;i<14;i++) noise(now + .35 + Math.random()*1.1, .035, 'highpass', 2500, 2000, .12 + Math.random()*.12);
    }
  }
  function whoosh(){
    if (!soundOn || !actx) return;
    noise(actx.currentTime, .7, 'bandpass', 600, 2400, .06);
  }
  function chime(){
    if (!soundOn || !actx) return;
    const t = actx.currentTime;
    [880, 1318.5].forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12/(i+1), t+.01);
      g.gain.exponentialRampToValueAtTime(.0001, t+1.1);
      o.connect(g).connect(master); o.start(t); o.stop(t+1.2);
    });
  }
  const soundBtn = document.querySelector('.sound-btn');
  soundBtn.addEventListener('click', () => {
    initAudio();
    if (!actx) return;
    actx.resume();
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn);
    soundBtn.innerHTML = soundOn ? '🔊 <span>Sound on</span>' : '🔈 <span>Sound off</span>';
    if (soundOn) chime();
  });

  /* ================= Canvas setup ================= */
  const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
  const fx  = document.getElementById('fx'),  fctx = fx.getContext('2d');
  let W = 0, H = 0, stars = [];
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [sky, fx]){
      c.width = W*dpr; c.height = H*dpr;
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    }
    const count = Math.round(W*H / 6500);
    stars = Array.from({length:count}, () => ({
      x: Math.random()*W, y: Math.random()*H*.85,
      r: Math.random()*1.3 + .2, ph: Math.random()*6.28, sp: Math.random()*1.5 + .4
    }));
    buildToran();
  }

  function drawSky(t){
    sctx.clearRect(0,0,W,H);
    for (const s of stars){
      const a = reduceMotion ? .7 : .35 + .65*Math.abs(Math.sin(t*.001*s.sp + s.ph));
      sctx.globalAlpha = a;
      sctx.fillStyle = '#fff6e0';
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  /* ================= Fireworks ================= */
  const rockets = [], sparks = [], flashes = [];
  const rand = (a,b) => a + Math.random()*(b-a);

  class Spark{
    constructor(x,y,vx,vy,o={}){
      this.x=x; this.y=y; this.px=x; this.py=y; this.vx=vx; this.vy=vy;
      this.hue=o.hue ?? 40; this.sat=o.sat ?? 100; this.light=o.light ?? 62;
      this.alpha=1; this.decay=o.decay ?? rand(.011,.022);
      this.fric=o.fric ?? .965; this.grav=o.grav ?? .055; this.size=o.size ?? 2.1;
      this.flicker=!!o.flicker; this.crackle=!!o.crackle; this.cracked=false;
    }
    update(){
      this.px=this.x; this.py=this.y;
      this.vx*=this.fric; this.vy*=this.fric; this.vy+=this.grav;
      this.x+=this.vx; this.y+=this.vy; this.alpha-=this.decay;
      if (this.crackle && !this.cracked && this.alpha < .38){
        this.cracked = true;
        for (let i=0;i<4;i++) sparks.push(new Spark(this.x,this.y,rand(-1.6,1.6),rand(-1.6,1.6),{hue:50,sat:30,light:92,decay:.06,size:1.2,grav:.02}));
      }
    }
    draw(c){
      const a = this.flicker ? this.alpha*rand(.3,1) : this.alpha;
      if (a <= 0) return;
      c.strokeStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`;
      c.lineWidth = this.size;
      c.beginPath(); c.moveTo(this.px,this.py); c.lineTo(this.x,this.y); c.stroke();
    }
  }

  class Rocket{
    constructor(tx,ty,type,hue){
      this.sx = Math.min(W-20, Math.max(20, tx + rand(-140,140)));
      this.sy = H + 8; this.x=this.sx; this.y=this.sy; this.tx=tx; this.ty=ty;
      this.dist = Math.hypot(tx-this.sx, ty-this.sy);
      this.ang = Math.atan2(ty-this.sy, tx-this.sx);
      this.speed = 1.8; this.acc = 1.05; this.trail = [];
      this.type=type; this.hue=hue; this.done=false;
    }
    update(){
      this.trail.push([this.x,this.y]); if (this.trail.length > 5) this.trail.shift();
      this.speed = Math.min(this.speed*this.acc, 16);
      this.x += Math.cos(this.ang)*this.speed; this.y += Math.sin(this.ang)*this.speed;
      if (Math.random() < .7) sparks.push(new Spark(this.x,this.y,rand(-.4,.4),rand(.4,1.4),{hue:38,light:70,decay:.045,size:1.3,grav:.03}));
      if (Math.hypot(this.x-this.sx, this.y-this.sy) >= this.dist){
        this.done = true; explode(this.tx, this.ty, this.type, this.hue);
      }
    }
    draw(c){
      const [lx,ly] = this.trail[0] || [this.x,this.y];
      c.strokeStyle = `hsl(${this.hue},100%,82%)`; c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(lx,ly); c.lineTo(this.x,this.y); c.stroke();
    }
  }

  const TYPES = ['peony','peony','ring','willow','double','chrysanthemum','heart','palm'];
  function explode(x,y,type,hue){
    flashes.push({x,y,a:.55,r:rand(70,120),hue});
    boom(type === 'chrysanthemum' || type === 'willow');
    const n = reduceMotion ? .5 : 1;
    switch(type){
      case 'ring': {
        const tilt = rand(.45,1), rot = rand(0,Math.PI);
        for (let i=0;i<70*n;i++){
          const a = i/(70*n)*Math.PI*2, vx = Math.cos(a)*5, vy = Math.sin(a)*5*tilt;
          sparks.push(new Spark(x,y, vx*Math.cos(rot)-vy*Math.sin(rot), vx*Math.sin(rot)+vy*Math.cos(rot), {hue,fric:.96,grav:.035}));
        }
        for (let i=0;i<30*n;i++){ const a=rand(0,6.28), s=rand(.5,1.8); sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue:(hue+180)%360,size:1.5})); }
        break;
      }
      case 'willow':
        for (let i=0;i<100*n;i++){ const a=rand(0,6.28), s=rand(1,5.5);
          sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue:42,sat:95,light:58,decay:rand(.005,.009),fric:.975,grav:.04,flicker:true,size:1.7})); }
        break;
      case 'heart':
        for (let i=0;i<90*n;i++){
          const t = i/(90*n)*Math.PI*2;
          const hx = 16*Math.sin(t)**3;
          const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
          sparks.push(new Spark(x,y,hx*.3,hy*.3,{hue:rand(330,350),light:66,fric:.955,grav:.025,decay:.013}));
        }
        break;
      case 'double': {
        const h2 = (hue + 150) % 360;
        for (let i=0;i<60*n;i++){ const a=rand(0,6.28), s=rand(4,6); sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue})); }
        for (let i=0;i<50*n;i++){ const a=rand(0,6.28), s=rand(1.2,2.8); sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue:h2})); }
        break;
      }
      case 'palm':
        for (let k=0;k<9;k++){
          const a = k/9*Math.PI*2 + rand(-.1,.1);
          for (let j=0;j<10*n;j++){ const s = 2 + j*.42; sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue:rand(30,48),light:60,decay:rand(.009,.014),fric:.968,grav:.05,size:2.2})); }
        }
        break;
      case 'chrysanthemum':
        for (let i=0;i<120*n;i++){ const a=rand(0,6.28), s=Math.sqrt(Math.random())*6.2;
          sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue:hue+rand(-15,15),crackle:true,size:1.8})); }
        break;
      default: // peony
        for (let i=0;i<110*n;i++){ const a=rand(0,6.28), s=Math.sqrt(Math.random())*6;
          sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{hue:hue+rand(-20,20)})); }
    }
  }

  function launch(tx,ty,type){
    if (rockets.length > 14) return;
    const hue = [5,25,40,50,120,170,200,280,320,340][Math.floor(Math.random()*10)];
    rockets.push(new Rocket(tx, ty, type || TYPES[Math.floor(Math.random()*TYPES.length)], hue));
    whoosh();
  }
  const launchRandom = (type) => launch(rand(W*.12, W*.88), rand(H*.1, H*.45), type);

  /* ================= Diyas ================= */
  const DIYA_COUNT = 7;
  const row = document.querySelector('.diyas');
  const hint = document.querySelector('.hint');
  const diyas = [];
  let finaleDone = false, touched = false;

  for (let i=0;i<DIYA_COUNT;i++){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'diya';
    b.setAttribute('aria-label', `Light diya ${i+1}`);
    b.setAttribute('aria-pressed', 'false');
    b.style.setProperty('--fl', `${rand(1.1,1.6).toFixed(2)}s`);
    b.innerHTML = '<span class="glow"></span><span class="base"></span><span class="bowl"></span><span class="spout"></span><span class="rim"></span><span class="wick"></span><span class="flame"></span>';
    b.addEventListener('click', () => { touched = true; setLit(b, !b.classList.contains('lit'), true); });
    row.appendChild(b); diyas.push(b);
  }

  function flamePoint(d){
    const r = d.querySelector('.flame').getBoundingClientRect();
    return [r.left + r.width/2, r.bottom - r.height*.45];
  }

  function setLit(d, on, byUser){
    d.classList.toggle('lit', on);
    d.setAttribute('aria-pressed', on);
    d.setAttribute('aria-label', `${on ? 'Blow out' : 'Light'} diya ${diyas.indexOf(d)+1}`);
    if (on){
      const [x,y] = flamePoint(d);
      for (let i=0;i<22;i++){ const a=rand(0,6.28), s=rand(.6,2.6); sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s-1,{hue:42,light:70,decay:.03,size:1.6,grav:.04})); }
      if (byUser) chime();
    }
    updateHint();
  }

  function updateHint(){
    const lit = diyas.filter(d => d.classList.contains('lit')).length;
    if (lit === DIYA_COUNT){
      if (!finaleDone){ finaleDone = true; finale(); }
      hint.textContent = 'You lit up the night ✨ Shubh Deepavali from DevSource!';
    } else {
      finaleDone = false;
      document.body.classList.remove('finale');
      hint.textContent = lit === 0 ? 'Tap each diya to light it 🪔'
        : `${lit} of ${DIYA_COUNT} diyas lit — keep going 🪔`;
    }
  }

  function finale(){
    document.body.classList.add('finale');
    const order = ['heart','chrysanthemum','ring','willow','double','palm','peony','heart','willow','chrysanthemum','ring','double','palm','peony'];
    const total = reduceMotion ? 4 : order.length;
    for (let i=0;i<total;i++) setTimeout(() => launchRandom(order[i]), i*230);
  }

  // Light the centre diya once as a gentle demo
  setTimeout(() => { if (!touched) setLit(diyas[Math.floor(DIYA_COUNT/2)], true, false); }, 1400);

  /* ================= Tap the sky ================= */
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('button, a, .editor')) return;
    launch(e.clientX, e.clientY);
  });

  /* ================= Main loop ================= */
  function frame(t){
    drawSky(t);

    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,.24)';
    fctx.fillRect(0,0,W,H);
    fctx.globalCompositeOperation = 'lighter';
    fctx.lineCap = 'round';

    const auto = reduceMotion ? .004 : (finaleDone ? .03 : .016);
    if (Math.random() < auto) launchRandom();

    // embers rising from lit diyas
    if (!reduceMotion){
      for (const d of diyas){
        if (d.classList.contains('lit') && Math.random() < .05){
          const [x,y] = flamePoint(d);
          if (y > 0 && y < H) sparks.push(new Spark(x+rand(-3,3), y-12, rand(-.25,.25), rand(-1.1,-.5), {hue:rand(30,45),light:65,decay:.012,fric:.99,grav:-.004,size:1.4,flicker:true}));
        }
      }
    }

    for (let i=flashes.length-1;i>=0;i--){
      const f = flashes[i];
      const g = fctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      g.addColorStop(0, `hsla(${f.hue},100%,80%,${f.a})`);
      g.addColorStop(1, `hsla(${f.hue},100%,50%,0)`);
      fctx.fillStyle = g; fctx.beginPath(); fctx.arc(f.x,f.y,f.r,0,6.283); fctx.fill();
      f.a -= .06; if (f.a <= 0) flashes.splice(i,1);
    }
    for (let i=rockets.length-1;i>=0;i--){ const r = rockets[i]; r.update(); r.draw(fctx); if (r.done) rockets.splice(i,1); }
    for (let i=sparks.length-1;i>=0;i--){ const s = sparks[i]; s.update(); s.draw(fctx); if (s.alpha <= 0 || s.y > H+20) sparks.splice(i,1); }
    if (sparks.length > 3000) sparks.splice(0, sparks.length - 3000);

    requestAnimationFrame(frame);
  }

  /* ================= Typed code wish ================= */
  const tokens = [
    ['c','// diwali.js — compiled with love by DevSource 🪔\n'],
    ['k','const '],['v','diwali'],['p',' = '],['k','new '],['f','Festival'],['p','({\n'],
    ['p','  lights: '],['n','Infinity'],['p',',\n'],
    ['p','  sweets: '],['s','"unlimited"'],['p',',\n'],
    ['p','  bugs: '],['n','0'],['p','\n});\n\n'],
    ['v','diwali'],['p','.'],['f','wish'],['p','(\n'],
    ['s','  "May your ideas compile perfectly,\n   your dreams deploy smoothly,\n   and your journey light up like festive code 🚀"'],
    ['p','\n);']
  ];
  const pre = document.getElementById('code');
  function typeCode(){
    if (reduceMotion){
      pre.innerHTML = tokens.map(([c,t]) => `<span class="t-${c}">${t.replace(/</g,'&lt;')}</span>`).join('');
      return;
    }
    const cursor = document.createElement('span'); cursor.className = 'cursor';
    let ti = 0, chars = [], ci = 0, span = null;
    pre.appendChild(cursor);
    (function step(){
      if (ti >= tokens.length) return;
      if (!span){ span = document.createElement('span'); span.className = 't-' + tokens[ti][0]; pre.insertBefore(span, cursor); chars = Array.from(tokens[ti][1]); ci = 0; }
      const ch = chars[ci++]; span.textContent += ch;
      if (ci >= chars.length){ ti++; span = null; }
      setTimeout(step, ch === '\n' ? 140 : rand(14,34));
    })();
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
  setTimeout(typeCode, 600);
})();
</script>
</body>
</html>
